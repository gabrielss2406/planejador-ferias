services:
  ferias:
    build: .
    container_name: planejador-ferias
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ferias-data:/data

  # domínio raiz (hubproject.space): ads.txt do AdSense e página inicial; ver ads/README.md
  ads:
    build:
      context: .
      dockerfile: ads/Dockerfile
    container_name: planejador-ads
    restart: unless-stopped
    ports:
      - "8081:80"

volumes:
  ferias-data:
